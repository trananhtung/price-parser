[package]
name = "price-parser"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Extract a price amount and currency from a string, guessing the decimal/thousands separator. A faithful port of the price-parser Python package."
documentation = "https://docs.rs/price-parser"
repository = "https://github.com/trananhtung/price-parser"
homepage = "https://github.com/trananhtung/price-parser"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["price", "currency", "money", "parse", "scraping"]
categories = ["parser-implementations", "value-formatting"]
authors = ["trananhtung"]
exclude = ["/.github", "/.gitignore"]

[dependencies]
regex = "1"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
